name: Test and deploy WeatherNext raw backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Run backend unit tests
        working-directory: backend
        env:
          REQUIRE_ID_TOKEN: "false"
          PYTHONPATH: "."
        run: python -m pytest -q
      - name: Compile backend
        run: python -m py_compile backend/app.py
      - name: Build backend container
        run: docker build -t weathernext3-backend:test backend

  deploy:
    needs: test
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' && vars.WN3_RUNTIME_SERVICE_ACCOUNT != '' && vars.WN3_OAUTH_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
      - name: Build backend image
        run: docker build -t us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/weathernext3/backend:${{ github.sha }} backend
      - name: Push backend image
        run: docker push us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/weathernext3/backend:${{ github.sha }}
      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy weathernext3-backend \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=us-east1 \
            --platform=managed \
            --image=us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/weathernext3/backend:${{ github.sha }} \
            --service-account=${{ vars.WN3_RUNTIME_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --cpu=2 \
            --memory=2Gi \
            --concurrency=2 \
            --min-instances=0 \
            --max-instances=2 \
            --timeout=300 \
            --set-env-vars=GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GOOGLE_OAUTH_CLIENT_ID=${{ vars.WN3_OAUTH_CLIENT_ID }},ALLOWED_ORIGINS=https://mefferso.github.io,REQUIRE_ID_TOKEN=true,BUILD_SHA=${{ github.sha }} \
            --set-secrets=ALLOWED_EMAILS=WN3_ALLOWED_EMAILS:latest
      - name: Verify deployed health endpoint
        run: |
          SERVICE_URL="$(gcloud run services describe weathernext3-backend --project=${{ vars.GCP_PROJECT_ID }} --region=us-east1 --format='value(status.url)')"
          echo "Cloud Run URL: ${SERVICE_URL}"
          curl --fail --show-error --silent --retry 4 --retry-delay 3 "${SERVICE_URL}/health"
